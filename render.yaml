services:
  - type: web
    name: mailmind-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: APP_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOKEN_ENC_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SQLITE_PATH
        sync: false
      - key: FEATURE_REGRET_SHIELD
        sync: false
      - key: FEATURE_SENDER_TRUST
        sync: false
