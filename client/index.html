<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF4B2B'><path d='M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailMind AI — The Sorting Room | AI Email Firewall</title>
    <!-- Pre-paint inline script: eliminates theme flicker / flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mailmind-sorting-theme') || localStorage.getItem('mailmind-theme');
          var isNight = true;
          if (saved === 'day' || saved === 'light') {
            isNight = false;
          } else if (saved === 'night' || saved === 'dark') {
            isNight = true;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            isNight = false;
          }
          var root = document.documentElement;
          if (isNight) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'night');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'day');
          }
          if (localStorage.getItem('mailmind-reduce-motion') === 'true') {
            root.classList.add('reduced-motion');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--color-ink)] antialiased selection:bg-[var(--color-red)] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
